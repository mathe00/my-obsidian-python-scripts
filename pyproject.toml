# =============================================================================
# My Obsidian Python Bridge Scripts - project configuration
#
# This repository is a *collection of standalone scripts* (not an installable
# package): the Obsidian Python Bridge plugin discovers and executes the .py
# files living at the repo root. Hence `package = false` for uv and no
# [build-system] section.
#
# Dev tooling (lint, format, tests) is configured here:
#   uv sync                 -> create .venv + install dev group
#   uv run ruff format .    -> format
#   uv run ruff check .     -> lint
#   uv run pytest           -> unit tests
# =============================================================================

[project]
name = "my-obsidian-python-scripts"
version = "2.1.0"
description = "Collection of Python scripts for the Obsidian Python Bridge V2 plugin"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "mathe00" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.0",
]

[tool.uv]
# Scripts collection, not a buildable package.
package = false

# -----------------------------------------------------------------------------
# Ruff — lint + format
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", ".opencode"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "N",   # pep8-naming
    "UP",  # pyupgrade (modern syntax)
    "B",   # flake8-bugbear (likely bugs)
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long — the formatter owns this; long strings/URLs stay readable
    "SIM105", # contextlib.suppress — explicit try/except/pass is clearer for best-effort notifications
]

[tool.ruff.lint.per-file-ignores]
# Test modules may use magic values and long literals freely;
# keep asserts readable without docstring pressure.
"tests/*" = ["E501"]

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
